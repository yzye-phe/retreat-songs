<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>詩歌歌詞</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0a0e;
    --surface: #16121a;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --gold-dim: #7a621e;
    --text: #f0e8d8;
    --text-dim: #a89880;
    --accent: #8b5cf6;
    --accent2: #c084fc;
    --divider: rgba(201,168,76,0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { font-size: 20px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif TC', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(139,92,246,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(201,168,76,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* ========== MENU PAGE ========== */
  #menuPage {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 40px 20px 60px;
  }

  .menu-header {
    text-align: center;
    margin-bottom: 40px;
  }

  .menu-header .cross {
    font-size: 2rem;
    color: var(--gold);
    margin-bottom: 12px;
  }

  .menu-header h1 {
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    color: var(--gold-light);
    letter-spacing: 0.2em;
    margin-bottom: 6px;
  }

  .menu-header p {
    font-size: 0.8rem;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  .menu-line {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 16px auto 0;
  }

  /* Song cards */
  .song-card {
    background: linear-gradient(135deg, rgba(30,24,38,0.9), rgba(22,18,26,0.9));
    border: 1px solid var(--divider);
    border-radius: 16px;
    padding: 28px 24px;
    margin-bottom: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 20px;
    transition: all 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    overflow: hidden;
  }

  .song-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(201,168,76,0.06), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .song-card:active::before { opacity: 1; }
  .song-card:active { transform: scale(0.98); border-color: var(--gold); }

  .card-num {
    font-family: 'Cinzel', serif;
    font-size: 1.5rem;
    color: var(--gold-dim);
    min-width: 36px;
    text-align: center;
    line-height: 1;
  }

  .card-info { flex: 1; }

  .card-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--gold-light);
    letter-spacing: 0.06em;
    line-height: 1.4;
    margin-bottom: 4px;
  }

  .card-sub {
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  .card-arrow {
    font-size: 1.4rem;
    color: var(--gold-dim);
  }

  /* ========== SONG PAGE ========== */
  #songPage {
    display: none;
    position: relative;
    z-index: 1;
    min-height: 100vh;
    flex-direction: column;
  }

  #songPage.active {
    display: flex;
  }

  /* Back bar */
  .back-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13,10,14,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--divider);
    display: flex;
    align-items: center;
    padding: 0 16px;
    height: 60px;
    gap: 12px;
  }

  .back-btn {
    background: rgba(201,168,76,0.12);
    border: 1px solid var(--divider);
    border-radius: 10px;
    color: var(--gold-light);
    font-size: 1rem;
    padding: 10px 18px;
    cursor: pointer;
    font-family: 'Noto Serif TC', serif;
    letter-spacing: 0.05em;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .back-btn:active { background: rgba(201,168,76,0.25); transform: scale(0.96); }

  .back-bar-title {
    font-size: 1rem;
    color: var(--text);
    font-weight: 600;
    letter-spacing: 0.05em;
    flex: 1;
    text-align: center;
    padding-right: 10px;
  }

  /* Theme toggle in back bar */
  .theme-btn {
    background: rgba(201,168,76,0.1);
    border: 1px solid var(--divider);
    border-radius: 10px;
    color: var(--gold);
    font-size: 1.1rem;
    width: 44px;
    height: 44px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .theme-btn:active { background: rgba(201,168,76,0.25); }

  /* Song hero */
  .song-hero {
    padding: 40px 24px 28px;
    text-align: center;
  }

  .song-hero::after {
    content: '';
    display: block;
    width: 70px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 24px auto 0;
  }

  .song-hero-num {
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    letter-spacing: 0.35em;
    color: var(--gold-dim);
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  .song-hero-title {
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--gold-light);
    letter-spacing: 0.1em;
    line-height: 1.4;
    text-shadow: 0 0 40px rgba(201,168,76,0.3);
  }

  /* Lyrics */
  .lyrics-body {
    padding: 8px 22px 40px;
    flex: 1;
  }

  .stanza { margin-bottom: 30px; }

  .stanza-label {
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    color: var(--gold-dim);
    text-transform: uppercase;
    font-family: 'Cinzel', serif;
    margin-bottom: 12px;
  }

  .lyric-line {
    font-size: 1.2rem;
    line-height: 2.1;
    color: var(--text);
    letter-spacing: 0.05em;
    font-weight: 400;
  }

  .lyric-line.emphasis {
    color: var(--gold-light);
    font-weight: 700;
  }

  .lyric-line.english {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.05rem;
    font-style: italic;
    color: var(--text-dim);
    letter-spacing: 0.02em;
    line-height: 2;
  }

  .stanza-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 26px 0;
    opacity: 0.4;
  }
  .stanza-divider::before,
  .stanza-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--gold);
  }
  .stanza-divider-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--gold);
  }

  .chorus {
    background: rgba(139,92,246,0.07);
    border-left: 3px solid var(--accent);
    border-radius: 0 10px 10px 0;
    padding: 18px 18px 18px 20px;
    margin: 0 -4px;
  }
  .chorus .stanza-label { color: var(--accent2); }
  .chorus .lyric-line { color: #ece6ff; }

  .repeat-line {
    color: var(--gold);
    font-weight: 700;
    font-size: 1.25rem;
  }

  /* ===== BOTTOM NAV (song page) ===== */
  .bottom-nav {
    position: sticky;
    bottom: 0;
    background: rgba(13,10,14,0.96);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--divider);
    display: flex;
    align-items: center;
    padding: 10px 12px 14px;
    gap: 10px;
  }

  .nav-song-btn {
    flex: 1;
    padding: 14px 8px;
    border-radius: 12px;
    border: 1px solid var(--divider);
    background: rgba(30,24,38,0.8);
    color: var(--text-dim);
    font-size: 0.75rem;
    font-family: 'Noto Serif TC', serif;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
    text-align: center;
    line-height: 1.4;
  }

  .nav-song-btn.current {
    background: rgba(201,168,76,0.15);
    border-color: var(--gold);
    color: var(--gold-light);
    font-weight: 700;
  }

  .nav-song-btn:active:not(.current) {
    background: rgba(201,168,76,0.08);
    border-color: var(--gold-dim);
    color: var(--text);
  }

  /* ===== LIGHT MODE ===== */
  body.light {
    --bg: #faf6ef;
    --surface: #f2ece0;
    --gold: #8a6200;
    --gold-light: #6b4c00;
    --gold-dim: #b08a3a;
    --text: #2a1f0a;

    --accent: #6d28d9;
    --accent2: #7c3aed;

  }
  body.light .chorus { background: rgba(109,40,217,0.05); }

  body.light .back-bar { background: rgba(250,246,239,0.97); }
  body.light .bottom-nav { background: rgba(250,246,239,0.97); }
  body.light .nav-song-btn { background: rgba(242,236,224,0.9); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .song-hero, .lyrics-body { animation: fadeIn 0.35s ease; }
</style>
</head>

let currentSong = -1;
let isLight = false;

function openSong(index) {
  currentSong = index;
  const song = songs[index];

  // Update back bar title
  document.getElementById('backBarTitle').textContent = song.title;

  // Render lyrics
  document.getElementById('songContent').innerHTML = `
    <div class="song-hero">
      <div class="song-hero-num">${song.num}</div>
      <div class="song-hero-title">${song.title}</div>
    </div>
    <div class="lyrics-body">${song.html}</div>
  `;

  // Update bottom nav highlight
  for (let i = 0; i < 4; i++) {
    document.getElementById('navBtn' + i).classList.toggle('current', i === index);
  }

  // Show song page, hide menu
  document.getElementById('menuPage').style.display = 'none';
  document.getElementById('songPage').classList.add('active');

  window.scrollTo(0, 0);

  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(() => {});
  }
}

function goBack() {
  document.getElementById('menuPage').style.display = 'flex';
  document.getElementById('songPage').classList.remove('active');
  window.scrollTo(0, 0);
}

function toggleTheme() {
  isLight = !isLight;
  document.body.classList.toggle('light', isLight);
  document.getElementById('themeBtn').textContent = isLight ? '🌙' : '☀';
}
